name: Release

on:
    push:
        tags: ['v*']

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Unit tests
              run: npm test

            - name: Build
              run: npm run build

            # The extensions.gnome.org reviewers asked for this property; assert it
            # rather than trusting it. All Symfony CLI handling belongs to the
            # helper daemon in its own repository.
            - name: Verify the extension spawns nothing
              run: |
                  if grep -nE 'Gio\.Subprocess|GLib\.spawn|timeout_add' dist/extension/extension.js; then
                      echo "The extension bundle must not spawn processes or own timers." >&2
                      exit 1
                  fi

            - name: Package
              run: |
                  set -euo pipefail
                  UUID=$(grep -Po '"uuid": "\K[^"]*' metadata.json)

                  BUILD_DIR="$RUNNER_TEMP/ego-build"
                  mkdir -p "$BUILD_DIR"
                  cp dist/extension/extension.js metadata.json stylesheet.css "$BUILD_DIR/"
                  cp -r schemas "$BUILD_DIR/"
                  # GNOME 45+ compiles schemas itself.
                  rm -f "$BUILD_DIR/schemas/gschemas.compiled"
                  (cd "$BUILD_DIR" && zip -qr "$GITHUB_WORKSPACE/${UUID}.zip" .)

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: '*.zip'
                  body: |
                      This release also needs a matching **helper app**:
                      https://github.com/tito10047/symfony-menubar-daemon/releases

                      The extension will not work without it.
