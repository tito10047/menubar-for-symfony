name: Release

on:
    push:
        tags: ['v*']

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build && npm run compile-schemas

            - name: Create ZIP
              run: |
                  UUID=$(grep -Po '"uuid": "\K[^"]*' metadata.json)
                  TMP_DIR="/tmp/ego-build"
                  mkdir -p "$TMP_DIR"
                  cp dist/extension.js metadata.json stylesheet.css "$TMP_DIR/"
                  cp -r schemas "$TMP_DIR/"
                  cd "$TMP_DIR" && zip -r "../${UUID}.zip" .
                  mv "/tmp/${UUID}.zip" .

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: "*.zip"